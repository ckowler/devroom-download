[package]
name = "devroom-download-core"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Local-first download engine for DEVROOM DOWNLOAD"

[lib]
name = "devroom_download_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
thiserror = "2"
jni = "0.21"
